    must_cite: [statutes-77]
    must_contain: ["77\\.25", "exempt"]
    notes: >
      In scope — ch.77 + RETR common questions; the answer is a transfer-fee
      exemption under §77.25(9) (trust/trustee conveyance). Content guard
      verifies ch.77 + a 77.25 exemption surface. This is not a content gap — a
      refusal would be the bug.


  # ── THEME: interpretation — domain-term ambiguity
  - queryId: gq-split-two-municipalities
    stratum: A
    tags: [interpretation, disambiguation]
    query: "pull all references to properties split between 2 municipalities"
    rubric: >
      The "split" here means one parcel straddling / located in two
      municipalities at the same time, not subdividing one parcel into many.
      PASS if the answer addresses that straddle sense — a single property lying
      in two municipalities and how it is assessed where it lies (e.g. §70.12) —
      even if it also notes the ambiguity. FAIL if the answer only / primarily
      treats "split" as parcel subdivision (one parcel divided into multiple)
      and never addresses the single-parcel-in-two-municipalities case.
    must_contain: ["70\\.12", "lies|located in the (municipality|district)|straddl"]
    notes: >
      "split" is ambiguous — parcel subdivision (one→many parcels) vs one parcel
      straddling two municipalities (the intended sense). The right concepts
      (§70.12, §70.08, WPAM Ch.7) may be found but framed around subdivision.
      Guard asserts the straddle-sense content (§70.12 "assessed where it lies")
      is present. Lever = prompt guidance to state the interpretation used. Also
      a DISAMBIGUATE candidate for the classifier harness (domain-term ambiguity).


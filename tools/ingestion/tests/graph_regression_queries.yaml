# Retrieval regression golden set — question-accuracy guardrail.
#
# A curated set of representative property-tax questions spanning the corpus
# (statutes ch. 33/60/66/70/74/76/77/200, admin rules, case law, WPAM, gov pubs,
# FAQ, form instructions) and answer shapes (multi-source, multi-turn,
# conditional, formula-description). Each row encodes a behavior retrieval +
# synthesis is expected to preserve.
#
# Grading (run_graph_regression.py):
#   - must_cite:         doc_ids that MUST appear in the answer's cited_doc_ids.
#   - must_contain:      regex/substring facts that MUST be asserted in the
#                        answer text (case-insensitive).
#   - must_not_contain:  regex/substring that MUST NOT appear in the answer text
#                        (case-insensitive). For citation-validity / synthesis
#                        guards where the failure is best stated negatively
#                        (fabricated URL, chapter-conflated link, bad paraphrase).
#   - stratum:           bucket. A = fact gate only; B/D/E = cite + fact gate.
#                        must_not_contain is enforced on A/B/D/E. Hallucinated
#                        case citations fail any stratum.
#   - tags:              METADATA ONLY (ignored by the grader). Group a guard by
#                        fix workstream so you can filter (e.g. grep
#                        'synthesis-guardrail').
#   - queryId:           an opaque, stable label for the row (used to select /
#                        report a single case). Not a production identifier.
#
# ── WHAT THIS HARNESS CANNOT TEST (deliberately excluded) ─────────────────────
# run_graph_regression.run_one_query() calls run_agentic_loop() DIRECTLY, which
# does NOT invoke the pre-loop query classifier (classify_query lives only in
# handler.py). So this harness CANNOT observe an OUT_OF_SCOPE / DISAMBIGUATE /
# TOPIC_SHIFT verdict — every query here is forced through retrieval. Therefore:
#   * Rows tagged oos-content-half appear here only as their CONTENT half — "IF
#     we proceed, does retrieval find the right material?". Their BEHAVIORAL half
#     (must the classifier stop refusing?) is a classifier-harness guard, NOT
#     expressible here.
#   * Pure classifier decisions (PROCEED / DISAMBIGUATE / OUT_OF_SCOPE) belong in
#     the sibling classifier harness (classifier_regression_queries.yaml +
#     run_classifier_regression.py), which exercises classify_query directly.
#
# Two-run workflow (see run_graph_regression.py docstring):
#   --mode baseline   (capture current behavior BEFORE deploying a change)
#   --mode after      (re-run AFTER deploying)
#   --compare-only    (diff cited-docs / facts / turns per query)

queries:
  - queryId: gq-7725-conveyance-security
    stratum: B
    query: "explain when sec. 77.25(10) applies and does not apply to a conveyance of real estate"
    rubric: >
      PASS if the answer explains BOTH when §77.25(10) applies AND when it does
      not apply to a conveyance of real estate — i.e. it frames (10) as the
      transfer-fee exemption for a conveyance of real estate as security for a
      debt or obligation and distinguishes true security conveyances from
      outright transfers. FAIL if it only lists (10) without explaining the
      apply / does-not-apply boundary, or misstates the subsection's subject.
    must_cite: [statutes-77]
    must_contain: ["77\\.25\\(10\\)", "security for a debt|debt or obligation"]
    notes: >
      Transfer-fee exemption, ch. 77. Digs into a specific subsection
      (77.25(10)) plus siblings (10m) — a dense-enumerated-section case that
      exercises subsection-exact fetch. Cites statutes-77, admin rule Tax 15,
      case law, and the RETR overview form instructions.

  - queryId: gq-lhp-state-assessed
    stratum: B
    query: "if a company qualifies as a Light, Heat, and Power company and has a facility with a nameplate capacity less than 50 megawatts and located in multiple municipalities are they state assessed?"
    rubric: >
      PASS if the answer reaches a clear determination of whether the described
      Light/Heat/Power company is state-assessed, grounded in ch. 76 (esp.
      §76.28 and the nameplate-capacity / multi-municipality factors) rather
      than fanning out to unrelated chapters. FAIL if it never resolves the
      state-assessment question or does not ground the answer in ch. 76.
    must_cite: [statutes-76]
    must_contain: ["76\\.28", "state assess|state-assessed|ch\\.? ?76"]
    notes: >
      Utility state-assessment, ch. 76. Long multi-factor conditional question;
      answer weaves 76.025/76.28 subsections with the WPAM. Stresses whether
      the loop stays grounded in ch. 76 rather than fanning out.

  - queryId: gq-highest-best-use
    stratum: B
    query: "explain highest and best use as it is used and required by assessors"
    rubric: >
      PASS if the answer explains the highest-and-best-use doctrine as assessors
      apply it (legally permissible, physically possible, financially feasible,
      maximally productive use) and grounds it in §70.32 and the WPAM. FAIL if
      it does not actually explain the HBU concept in the assessment context.
    must_cite: [statutes-70, wpam-wisconsin-property-assessment-manual-2026]
    must_contain: ["highest and best use", "70\\.32"]
    notes: >
      Core valuation doctrine. Case-law-heavy (6 case-law nodes cited) +
      statutes-70 + WPAM. Guards that case citations stay real (no
      hallucinated case-law ids) across a broad multi-source answer.

  - queryId: gq-town-clerk-bor-chair
    stratum: B
    query: "can the town clerk be the chairman of board of review"
    rubric: >
      PASS if the answer gives a direct resolution of whether the town clerk may
      serve as chair of the Board of Review, grounded in the BOR composition
      rules (§70.46) and the elected-vs-appointed distinction. FAIL if it does
      not directly answer whether the clerk can be chair with a statutory basis.
    must_cite: [statutes-70]
    must_contain: ["70\\.46", "board of review|BOR"]
    notes: >
      Board-of-Review procedure across ch. 60 (town offices) and ch. 70
      (70.46). Conditional (elected vs. appointed) reasoning; cites the 2026
      Board of Review Guide alongside the statutes.

  - queryId: gq-tid-increment
    stratum: B
    query: "how do you determine the tax increment for a tid"
    rubric: >
      PASS if the answer describes the tax-increment mechanics for a TID under
      §66.1105 — the increment as the difference between current value and the
      certified base value — as a method, WITHOUT inventing specific computed
      dollar figures or a dollar tax liability. FAIL if it omits the
      base-vs-current-value method or fabricates concrete computed dollar amounts.
    must_cite: [statutes-66]
    must_contain: ["tax increment", "66\\.1105"]
    notes: >
      TID/TIF increment mechanics, ch. 66.1105. Cites statutes-66, the TIF
      manual gov pub, and the TIF FAQ — a formula-description answer that must
      stay grounded without inventing computed dollar figures.

  - queryId: gq-exempted-error-omitted
    stratum: B
    query: "If a property is exempted in error can the assessor assess it as omitted the following year"
    rubric: >
      PASS if the answer addresses whether property exempted in error can be
      picked up as omitted property in a later year via the omitted-property
      procedure of §70.44. FAIL if it never reaches the omitted-assessment
      mechanism / §70.44 for the exempted-in-error scenario.
    must_cite: [statutes-70]
    must_contain: ["70\\.44", "omitted"]
    notes: >
      Omitted-property procedure, 70.44. Cites statutes-70 subsections, a
      case-law node, the omitted-taxes form instructions, PA-502, and a FAQ —
      diverse framework coverage in one answer.

  # ════════════════════════════════════════════════════════════════════════════
  #  ADDITIONAL COVERAGE THEMES
  #  Below: guards grouped by fix workstream (subsection fetch, missing-citation,
  #  synthesis framing, citation validity, out-of-scope content half, ingestion
  #  gaps, load verification, known-good anchors). tags group each guard so a
  #  human can filter by workstream; the grader ignores tags.
  # ════════════════════════════════════════════════════════════════════════════

  # ── THEME: subsection-7011 — §70.11(49) recreational-prefab exemption.
  #    Both queries reach §70.11 (or should) but the (49) subsection could be
  #    ranking-dropped before the subsection-exact fetch fix; the 4/29/26 advisory
  #    now exists in-corpus.
  - queryId: gq-mobile-home-exemptions
    stratum: B
    tags: [subsection-7011]
    query: "What exemptions can apply to a mobile home?"
    rubric: >
      PASS only if the §70.11(49) recreational-prefabricated-home exemption is
      presented as a substantive exemption option applicable to mobile /
      manufactured homes, integrated into the list of exemptions with its
      citation (and ideally the 4/29/26 advisory). FAIL if §70.11(49) is merely
      name-dropped once (e.g. only under a trailing "Default Rule" note) without
      being carried as a cited exemption, or omitted entirely.
    must_cite: [statutes-70]
    must_contain: ["70\\.11\\(49\\)|recreational prefabricated"]
    notes: >
      §70.11 is reached and even a "section 49" query can fire, but when
      get_section runs in query/ranking mode the (49) subsection can be
      ranking-dropped and only name-dropped as plain text. Lever = prompt-nudge
      to use get_section subsection="49".

  - queryId: gq-camping-trailer-exemptions
    stratum: B
    tags: [subsection-7011]
    query: "What exemptions can apply to a camping trailer?"
    rubric: >
      PASS only if the answer surfaces and explains the §70.11(49)
      recreational-prefabricated-home exemption as applicable to a camping
      trailer (ideally citing the 4/29/26 advisory). FAIL if the answer stays on
      §70.111 / §70.11(19) and omits the §70.11(49) recreational exemption.
    must_cite: [statutes-70]
    must_contain: ["70\\.11\\(49\\)|recreational prefabricated"]
    notes: >
      Harder than the mobile-home case — if the agent stays on §70.111 and never
      touches §70.11, subsection-exact fetch cannot fire. Lever = surface the
      4/29/26 advisory (news_pages-cotvc-news-2026-04-29) via
      broad_discovery/vector_search, and/or a prompt cross-link hint.

  # ── THEME: missing-citation — correct source in corpus, never fetched/cited
  - queryId: gq-prior-year-roll
    stratum: B
    tags: [missing-citation, statute-page-neighbor]
    query: "Can a municipality use a prior year assessment roll for the current year?"
    rubric: >
      PASS if the answer cites and applies §70.56 (the "lost roll" / prior-year
      roll provision) as governing whether a municipality may use a prior year
      assessment roll for the current year. FAIL if §70.56 is absent.
    must_cite: [statutes-70]
    must_contain: ["70\\.56", "lost roll|prior year|new assessment"]
    notes: >
      §70.56 "Lost roll" is the sibling emergency provision to §70.71 (both on
      the same PDF page 44), but §70.56 can fail to enter a
      vector_search/get_section call. Lever = statute page-neighbor sibling
      backfill.

  - queryId: gq-bor-interpreter-waiver
    stratum: B
    tags: [missing-citation, synthesis-guardrail, clarity]
    query: "is the board of review required to have a foreign language interpreter?"
    rubric: >
      PASS if the answer explains the §70.47(8m) waiver process for the
      foreign-language interpreter requirement (i.e. how/when the interpreter
      requirement can be waived), not just the base requirement. FAIL if it
      states the interpreter requirement but omits the (8m) waiver process.
    must_cite: [statutes-70]
    must_contain: ["70\\.47\\(8m\\)|waiver"]
    notes: >
      Two related gaps: (a) answerStream has no themed-heading directive
      (emergent house style, not machine-checkable here); (b) §70.47(8) can be
      cited while the (8m) waiver process is omitted. This guard asserts the
      (8m)/waiver completeness half only.

  - queryId: gq-bor-process-steps
    stratum: B
    tags: [missing-citation, card-page-collision]
    query: "What are the steps of the Board of Review process?"
    rubric: >
      PASS if the enumerated Board of Review process steps include the §70.85
      appeal-to-the-Department-of-Revenue route as one of the post-BOR appeal
      options. FAIL if the steps omit the §70.85 DOR-review appeal.
    must_cite: [statutes-70]
    must_contain: ["70\\.85", "appeal.{0,40}(department of revenue|dor)|dor.{0,40}appeal"]
    notes: >
      The enumerated steps can omit the §70.85 DOR-review appeal route (§70.85
      is in corpus, p53). A 70.46/70.47 card page-collision (both on p38) is a
      separate card-relevance-gate issue, not assertable here. This guard covers
      the 70.85-appeal completeness half.

  - queryId: gq-full-value-annual
    stratum: B
    tags: [missing-citation, wpam-nav]
    query: "Are we required to have the assessor complete full value assessments each year?"
    rubric: >
      PASS if the answer draws on WPAM Ch.4 "The Assessment Cycle" and explains
      the distinction between a maintenance assessment and a revaluation
      (including what is minimally required for a maintenance assessment each
      year). FAIL if it omits the maintenance-vs-revaluation distinction.
    must_cite: [wpam-wisconsin-property-assessment-manual-2026]
    must_contain: ["maintenance assessment|revaluation"]
    notes: >
      WPAM Ch.4 "The Assessment Cycle" (maintenance vs revaluation) is in corpus,
      but vector search can miss it and the agent may not fall back to
      list_sections/get_section on WPAM. Lever = WPAM-navigation fallback.

  # ── THEME: synthesis-guardrail — correct sources retrieved, framing failed.
  #    These are Phase-B (answerStream) prompt-rule guards. Several defects
  #    (heading style, ordering, over-inclusion) are only partly machine-checkable;
  #    each guard asserts the strongest positive/negative signal available.
  - queryId: gq-appeal-assessed-value
    stratum: A
    tags: [synthesis-guardrail]
    query: "what is the process to appeal an assessed value?"
    rubric: >
      PASS if, where the answer states the §74.37 excessive-assessment
      precondition that the Board of Review objection process must be followed,
      it ALSO states the express statutory exception — that this requirement
      does NOT apply if notice under §70.365 was not given. FAIL if the answer
      states the BOR-objection precondition without the §70.365 notice exception,
      or omits the exception entirely.
    must_contain: ["70\\.365", "notice"]
    notes: >
      The §74.37 excessive-assessment precondition ("BOR objection must be
      followed") can be stated while the express statutory EXCEPTION — "does not
      apply if notice under s. 70.365 was not given", present in the retrieved
      WPAM Ch.20 chunk — is dropped in synthesis. Lever = answerStream "state
      express statutory exceptions" rule.

  - queryId: gq-501c3-exemption
    stratum: A
    tags: [synthesis-guardrail]
    query: "Does my 501c3 property qualify for exemption?"
    rubric: >
      FAIL if Form PC-220 / §70.337 appears under a heading or section framed as
      how to apply for / claim / obtain the exemption — e.g. a "How to Apply" or
      "Filing Requirements to claim exemption" section, or listed alongside the
      PR-230 request form as one of the steps to get exempt — EVEN IF the
      surrounding sentence also notes PC-220 is biennial. That placement is the
      defect: it implies PC-220 is part of the exemption REQUEST. PC-220/§70.337
      is a POST-exemption biennial report filed only after the property is
      already exempt. PASS only if PC-220/§70.337 is either omitted or presented
      OUTSIDE the apply/request/how-to-obtain flow (e.g. under an ongoing-
      obligations or "after you are exempt" section), clearly separated from the
      PR-230 request step.
    must_contain: ["PR-230"]
    must_not_contain: ["how to apply[\\s\\S]{0,200}PC-220"]
    notes: >
      PC-220/§70.337 (a POST-exemption biennial report) can be listed under a
      "How to Apply" heading, implying it is part of the exemption REQUEST. This
      guard approximates the defect: PR-230 (the actual request form) must be
      present, and "PC-220" must NOT appear within ~200 chars after a "How to
      Apply" heading. Regex is best-effort (heading text may vary) — the durable
      fix is the answerStream request-vs-reporting taxonomy rule; treat a
      must_not_contain miss here as advisory.

  - queryId: gq-property-taxes-determined
    stratum: B
    tags: [synthesis-guardrail, citation-validity]
    query: "How are my property taxes determined?"
    rubric: >
      FAIL if the answer cites Milewski v. Town of Dover (or any court case) as
      authority for mill-rate / property-tax COMPUTATION mechanics — that case
      concerns valuation and the right to view a property, not tax computation.
      PASS if the mill-rate / tax-determination mechanics are attributed to the
      DOR guidance sources (Guide for Property Owners, Assessment and Tax Roll
      Instructions for Clerks / PA-502) rather than to case law.
    must_cite: [gov_publications-pa502]
    must_contain: ["mill rate"]
    notes: >
      The mill-rate step can wrongly cite Milewski v. Town of Dover
      (case-law-377-wis-2d-38, a view/uniformity holding) as authority for
      mill-rate MECHANICS; correct sources are the Guide for Property Owners
      (pb060) and Assessment/Tax Roll Instructions for Clerks (pa502). The
      grader has no must_NOT_cite, so this guard only positively asserts pa502 is
      cited + "mill rate" present; the "don't cite case law for mechanics" half
      needs a must_not_cite capability or the answerStream case-law-usage guard.

  - queryId: gq-land-agricultural
    stratum: A
    tags: [synthesis-guardrail, clarity]
    query: "Does my land qualify as agricultural?"
    rubric: >
      FAIL if the answer introduces the agricultural-qualification analysis as a
      "two-part test" (or otherwise promises a specific number of parts/tests)
      but then enumerates a DIFFERENT number of parts — e.g. opens with
      "two-part test" and then presents "Part 1 … Part 7". PASS if the announced
      number of parts/steps is internally consistent with the enumeration that
      follows (no numbering mismatch). Judge only the numbering consistency, not
      the substantive correctness of the agricultural test.
    must_not_contain: ["two-part test[\\s\\S]{0,600}### Part 7|two-part test[\\s\\S]{0,600}Part 7"]
    notes: >
      An opener can promise a "two-part test" then render "Part 1 … Part 7" — a
      numbering-consistency defect. Guard: the answer must NOT say "two-part
      test" and then present a "Part 7". Best-effort regex; the durable fix is
      the answerStream numbering-consistency guard.

  - queryId: gq-clerk-correct-roll-error
    stratum: B
    tags: [synthesis-guardrail]
    query: "How can the clerk correct an assessment roll error after the Board of Review has adjourned for the year?"
    rubric: >
      The question is about the CLERK correcting the CURRENT-year roll after BOR
      adjournment. §70.43 is an ASSESSOR-initiated correction of the PRECEDING
      (prior) year's error — wrong actor AND wrong year for this question. FAIL
      if the answer offers §70.43 as one of the available / enumerated correction
      mechanisms responsive to this question (e.g. as a numbered "mechanism" or
      option), regardless of the order it appears in, because that mis-scopes the
      answer to assessor prior-year processes the question did not ask about.
      PASS only if the answer confines its responsive mechanisms to the clerk's
      current-year authority (§70.73(1m), §70.52) and either omits §70.43 or
      explicitly flags it as NOT applicable to the clerk's current-year
      correction rather than presenting it as an option.
    must_cite: [statutes-70]
    must_contain: ["70\\.73\\(1m\\)"]
    notes: >
      The correct clerk/current-year statutes (§70.73(1m), §70.52) may be
      retrieved but buried under the §70.43 assessor/PRIOR-year mechanism plus a
      chargeback walkthrough (wrong actor + wrong year). Guard asserts the
      responsive §70.73(1m) is present; de-emphasis of §70.43 is not
      machine-checkable, so this is a weak positive — the framing defect needs a
      human/LLM judge. Lever = answerStream scope-to-actor/timeframe rule.

  - queryId: gq-waste-treatment-manufacturing
    stratum: A
    tags: [synthesis-guardrail, clarity]
    query: "If a waste treatment plant is not required to be permitted as a hazardous waste facility, do they still meet the requirements to be classified as a manufacturing facility according to the Wisconsin Statutes?"
    rubric: >
      PASS if the substance is correct: the answer addresses whether a
      non-hazardous waste treatment plant meets manufacturing-classification
      requirements, grounded in §70.995 (and the §291.01 hazardous-waste
      definition and/or §70.11(21)). FAIL only if the substantive answer is
      wrong or absent. Do NOT fail on framing/ordering — the substance can be
      correct even if the direct answer is buried.
    must_contain: ["70\\.995", "291\\.01|hazardous waste"]
    notes: >
      Substance is correct (70.995(2)(z), 291.01(22) definition, 70.11(21)); the
      risk is framing that under-serves the conditional (direct answer buried at
      the end). This guard pins the correct substance so a framing-only prompt
      fix does not regress the retrieval.

  - queryId: gq-amend-statement-assessment
    stratum: A
    tags: [synthesis-guardrail]
    query: "How do I amend my Statement of Assessment?"
    rubric: >
      When explaining what to do after amending the SOA, PASS if the answer uses
      the clear approved SOA-FAQ phrasing that treats the two inputs distinctly —
      i.e. when compiling tax bills, use the aggregate ratio found on the Final
      SOA AND the updated values from the amended SOA. FAIL if it collapses them
      into an ambiguous paraphrase such as using the aggregate ratio "combined
      with" the updated values (ambiguous phrasing that can leave new officials
      unsure what to do).
    must_contain: ["aggregate ratio"]
    must_not_contain: ["combined with"]
    notes: >
      The model can paraphrase the clear SOA-FAQ language ("...aggregate ratio
      found on the Final SOA AND the updated values...") into the ambiguous
      "combined with". Guard: keep "aggregate ratio", forbid "combined with".
      Lever = answerStream "prefer approved source phrasing for procedures" rule.

  # ── THEME: citation-validity — link/URL correctness (runs through the loop).
  - queryId: gq-hire-assessor
    stratum: A
    tags: [citation-validity]
    query: "We need to hire an assessor, how do we start the process?"
    rubric: >
      FAIL if any §61.19 (villages) reference or link in the answer resolves to
      the wrong chapter — e.g. a §61.19 label whose link/target points at ch. 62
      / §62.09 (the cities statute), a chapter-conflated citation. PASS if
      villages §61.19 is cited/linked to the villages chapter (statutes-61)
      correctly, or §61.19 is not referenced at all.
    must_not_contain: ["\\[§\\s*61\\.19[^\\]]*\\]\\(doc:statutes-62"]
    notes: >
      Phase-B chapter conflation — the villages §61.19 link can reuse the
      cities' doc:statutes-62 token. Guard: the answer must NOT render a §61.19
      label pointing at doc:statutes-62. Lever = Phase-B citation-repair pass
      (assert label chapter == doc chapter) and/or answerStream rule.

  - queryId: gq-assessor-directory-lookup
    stratum: A
    tags: [citation-validity, fabricated-url]
    query: "who is the assessor for Town of Otsego in columbia county wi"
    rubric: >
      This is an out-of-corpus directory lookup. FAIL if the answer emits a
      fabricated or unverified deep DOR URL for the assessor listing — in
      particular any revenue.wi.gov/.../assessors.aspx path (which 404s). PASS if
      the answer acknowledges it cannot identify the specific assessor and does
      NOT invent a nonexistent deep URL (the legitimate destination is the
      assrlist.pdf directory).
    must_not_contain: ["assessors\\.aspx"]
    notes: >
      Assessor-directory lookup is out-of-corpus (empty resources); the model can
      acknowledge the gap then improvise a fabricated deep URL
      revenue.wi.gov/Pages/SLF/assessors.aspx (404). Guard: answer must NOT
      contain that path. DOR's correct destination is assrlist.pdf. Lever =
      answerStream "never emit unretrieved deep URLs" rule + curated redirect
      map. (No must_cite — this query correctly cites nothing.)

  # ── THEME: oos-content-half — in-scope queries, CONTENT half only.
  #    The behavioral "must not refuse" half is a CLASSIFIER guard (see the
  #    sibling classifier harness); this harness bypasses the classifier, so here
  #    we only verify that IF the query proceeds, retrieval finds the right
  #    in-scope material. Per DOR guidance all four are genuinely in scope.
  - queryId: gq-measure-depreciation
    stratum: B
    tags: [oos-content-half]
    query: "how do you measure depreciation"
    rubric: >
      PASS if the answer substantively explains how depreciation is measured
      within the cost approach to value (WPAM), treating it as an in-scope
      valuation-process question. FAIL if it refuses / declares the question
      out of scope, or fails to explain depreciation measurement. (DOR: valuation
      processes are in scope.)
    must_cite: [wpam-wisconsin-property-assessment-manual-2026]
    must_contain: ["depreciation", "cost approach|cost-approach"]
    notes: >
      Depreciation is core to the cost approach to value (WPAM) — valuation
      processes are in scope. This CONTENT guard checks that the loop, when
      forced to run, cites WPAM cost-approach/depreciation. The classifier-refusal
      half is covered by the classifier harness.

  - queryId: gq-actual-view-new-dev
    stratum: B
    tags: [oos-content-half]
    query: "pull statute and WPAM references relating to getting actual view of properties specifically for new developments"
    rubric: >
      PASS if the answer surfaces statute and WPAM material on the assessor's
      right/duty to physically view (actual view of) property — e.g. §70.05
      and/or §70.32, WPAM view guidance, in the new-construction / new-development
      context. FAIL if it refuses / treats the request as off-topic, or fails to
      provide view-related statutory or WPAM content. (DOR confirms in scope.)
    must_cite: [statutes-70, wpam-wisconsin-property-assessment-manual-2026]
    must_contain: ["view", "70\\.05|70\\.32|new construction|new development"]
    notes: >
      The assessor's right/duty to physically view a property (§70.05/§70.32;
      WPAM; case law) is in scope. Content guard verifies retrieval surfaces
      statute + WPAM view material.

  - queryId: gq-trustee-deed-transfer-fee
    stratum: B
    tags: [oos-content-half]
    query: "When filing a Trustee's Deed from a trust to a married couple who are the trustees, is there a transfer fee exemption?"
    rubric: >
      PASS if the answer identifies that a transfer-fee exemption under ch. 77 /
      §77.25 applies to the described trust/trustee conveyance (DOR: exemption 9,

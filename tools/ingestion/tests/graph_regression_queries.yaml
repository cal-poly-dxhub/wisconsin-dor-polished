# Retrieval regression golden set — question-accuracy guardrail.
#
# Slimmed to a single stratum of real, thumbs-up production queries (captured
# 2026-08 → 09), chosen to be diverse (statutes ch. 60/66/70/76/77, admin
# rules, case law, WPAM, gov pubs, FAQ, form instructions) and complex
# (multi-source, multi-turn answers). These are the "known-good" behaviors we
# must not regress.
#
# Grading (run_graph_regression.py):
#   - must_cite:         doc_ids that MUST appear in the answer's cited_doc_ids.
#   - must_contain:      regex/substring facts that MUST be asserted in the
#                        answer text (case-insensitive).
#   - must_not_contain:  regex/substring that MUST NOT appear in the answer text
#                        (case-insensitive). For citation-validity / synthesis
#                        guards where the failure is best stated negatively
#                        (fabricated URL, chapter-conflated link, bad paraphrase).
#   - stratum:           bucket. A = fact gate only; B/D/E = cite + fact gate.
#                        must_not_contain is enforced on A/B/D/E. Hallucinated
#                        case citations fail any stratum.
#   - tags / expected_baseline / queryId_ref:  METADATA ONLY (ignored by the
#                        grader). tags group a guard by fix workstream so you can
#                        filter (e.g. grep 'oos-content-half'); expected_baseline
#                        records whether the guard is expected RED or GREEN today
#                        (pre-fix), so a human can run --mode baseline and confirm
#                        the known-failing set matches before shipping a fix.
#
# ── SCOPE OF THIS SET ─────────────────────────────────────────────────────────
# Rows 1-6 below (queryIds 0b50ac75 … e97be124) are the ORIGINAL known-good
# thumbs-up stratum — must not regress. Everything after the "FEEDBACK GUARD SET"
# banner was authored 2026-09-05 from the 28 mixed/negative feedback rows
# (/tmp/feedback_master_synthesis.md) to make prompt/retrieval fixes attributable
# and regression-safe. Many of those are EXPECTED TO FAIL today (pre-fix
# baseline) — see expected_baseline on each.
#
# ── WHAT THIS HARNESS CANNOT TEST (deliberately excluded) ─────────────────────
# run_graph_regression.run_one_query() calls run_agentic_loop() DIRECTLY, which
# does NOT invoke the pre-loop query classifier (classify_query lives only in
# handler.py). So this harness CANNOT observe an OUT_OF_SCOPE / DISAMBIGUATE /
# TOPIC_SHIFT verdict — every query here is forced through retrieval. Therefore:
#   * False-refusal rows (#22/#23/#24/#26) appear here only as their CONTENT half
#     (tag: oos-content-half) — "IF we proceed, does retrieval find the right
#     material?". Their BEHAVIORAL half (must the classifier stop refusing?) is a
#     classifier-harness guard, NOT expressible here.
#   * Pure classifier decisions (#6 must DISAMBIGUATE; #28 must stay OUT_OF_SCOPE
#     per DOR Decision 3; the email park-model / articles-of-incorporation
#     in-scope cases) are NOT added as active cases. They belong in a sibling
#     classifier harness (Task 51 pattern: pull the live disambiguationClassifier
#     prompt from the ModelConfig DynamoDB table, `converse` each labelled query
#     with Haiku temp 0.0, bucket by verdict). test_disambiguation.py exists but
#     is unit-level (mocked Bedrock) — the live labelled harness does not yet
#     exist. See the CLASSIFIER-HARDNESS BACKLOG comment at the bottom of file.
#
# Two-run workflow (see run_graph_regression.py docstring):
#   --mode baseline   (capture current prod behavior BEFORE deploying a change)
#   --mode after      (re-run AFTER deploying)
#   --compare-only    (diff cited-docs / facts / turns per query)

queries:
  - queryId: 0b50ac75
    stratum: B
    query: "explain when sec. 77.25(10) applies and does not apply to a conveyance of real estate"
    rubric: >
      PASS if the answer explains BOTH when §77.25(10) applies AND when it does
      not apply to a conveyance of real estate — i.e. it frames (10) as the
      transfer-fee exemption for a conveyance of real estate as security for a
      debt or obligation and distinguishes true security conveyances from
      outright transfers. FAIL if it only lists (10) without explaining the
      apply / does-not-apply boundary, or misstates the subsection's subject.
    must_cite: [statutes-77]
    must_contain: ["77\\.25\\(10\\)", "security for a debt|debt or obligation"]
    notes: >
      Transfer-fee exemption, ch. 77. Digs into a specific subsection
      (77.25(10)) plus siblings (10m) — a dense-enumerated-section case, the
      exact path the subsection-fetch change touches. Cites statutes-77, admin
      rule Tax 15, case law, and the RETR overview form instructions.

  - queryId: 1eada146
    stratum: B
    query: "if a company qualifies as a Light, Heat, and Power company and has a facility with a nameplate capacity less than 50 megawatts and located in multiple municipalities are they state assessed?"
    rubric: >
      PASS if the answer reaches a clear determination of whether the described
      Light/Heat/Power company is state-assessed, grounded in ch. 76 (esp.
      §76.28 and the nameplate-capacity / multi-municipality factors) rather
      than fanning out to unrelated chapters. FAIL if it never resolves the
      state-assessment question or does not ground the answer in ch. 76.
    must_cite: [statutes-76]
    must_contain: ["76\\.28", "state assess|state-assessed|ch\\.? ?76"]
    notes: >
      Utility state-assessment, ch. 76. Long multi-factor conditional question;
      answer weaves 76.025/76.28 subsections with the WPAM. Stresses whether
      the loop stays grounded in ch. 76 rather than fanning out.

  - queryId: 20c8678e
    stratum: B
    query: "explain highest and best use as it is used and required by assessors"
    rubric: >
      PASS if the answer explains the highest-and-best-use doctrine as assessors
      apply it (legally permissible, physically possible, financially feasible,
      maximally productive use) and grounds it in §70.32 and the WPAM. FAIL if
      it does not actually explain the HBU concept in the assessment context.
    must_cite: [statutes-70, wpam-wisconsin-property-assessment-manual-2026]
    must_contain: ["highest and best use", "70\\.32"]
    notes: >
      Core valuation doctrine. Case-law-heavy (6 case-law nodes cited) +
      statutes-70 + WPAM. Guards that case citations stay real (no
      hallucinated case-law ids) across a broad multi-source answer.

  - queryId: 8388fe28
    stratum: B
    query: "can the town clerk be the chairman of board of review"
    rubric: >
      PASS if the answer gives a direct resolution of whether the town clerk may
      serve as chair of the Board of Review, grounded in the BOR composition
      rules (§70.46) and the elected-vs-appointed distinction. FAIL if it does
      not directly answer whether the clerk can be chair with a statutory basis.
    must_cite: [statutes-70]
    must_contain: ["70\\.46", "board of review|BOR"]
    notes: >
      Board-of-Review procedure across ch. 60 (town offices) and ch. 70
      (70.46). Conditional (elected vs. appointed) reasoning; cites the 2026
      Board of Review Guide alongside the statutes.

  - queryId: cbce3376
    stratum: B
    query: "how do you determine the tax increment for a tid"
    rubric: >
      PASS if the answer describes the tax-increment mechanics for a TID under
      §66.1105 — the increment as the difference between current value and the
      certified base value — as a method, WITHOUT inventing specific computed
      dollar figures or a dollar tax liability. FAIL if it omits the
      base-vs-current-value method or fabricates concrete computed dollar amounts.
    must_cite: [statutes-66]
    must_contain: ["tax increment", "66\\.1105"]
    notes: >
      TID/TIF increment mechanics, ch. 66.1105. Cites statutes-66, the TIF
      manual gov pub, and the TIF FAQ — a formula-description answer that must
      stay grounded without inventing computed dollar figures.

  - queryId: e97be124
    stratum: B
    query: "If a property is exempted in error can the assessor assess it as omitted the following year"
    rubric: >
      PASS if the answer addresses whether property exempted in error can be
      picked up as omitted property in a later year via the omitted-property
      procedure of §70.44. FAIL if it never reaches the omitted-assessment
      mechanism / §70.44 for the exempted-in-error scenario.
    must_cite: [statutes-70]
    must_contain: ["70\\.44", "omitted"]
    notes: >
      Omitted-property procedure, 70.44. Cites statutes-70 subsections, a
      case-law node, the omitted-taxes form instructions, PA-502, and a FAQ —
      diverse framework coverage in one answer.


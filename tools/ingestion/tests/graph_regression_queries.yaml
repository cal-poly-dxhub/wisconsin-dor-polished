  - queryId: eddb38ca
    queryId_ref: "#8"
    stratum: A
    tags: [synthesis-guardrail]
    expected_baseline: failing
    query: "Does my 501c3 property qualify for exemption?"
    rubric: >
      FAIL if Form PC-220 / §70.337 appears under a heading or section framed as
      how to apply for / claim / obtain the exemption — e.g. a "How to Apply" or
      "Filing Requirements to claim exemption" section, or listed alongside the
      PR-230 request form as one of the steps to get exempt — EVEN IF the
      surrounding sentence also notes PC-220 is biennial. That placement is the
      defect: it implies PC-220 is part of the exemption REQUEST. PC-220/§70.337
      is a POST-exemption biennial report filed only after the property is
      already exempt. PASS only if PC-220/§70.337 is either omitted or presented
      OUTSIDE the apply/request/how-to-obtain flow (e.g. under an ongoing-
      obligations or "after you are exempt" section), clearly separated from the
      PR-230 request step.
    must_contain: ["PR-230"]
    must_not_contain: ["how to apply[\\s\\S]{0,200}PC-220"]
    notes: >
      #8 (down). PC-220/§70.337 (a POST-exemption biennial report) was listed
      under a "How to Apply" heading, implying it is part of the exemption
      REQUEST. Guard approximates the defect: PR-230 (the actual request form)
      must be present, and "PC-220" must NOT appear within ~200 chars after a
      "How to Apply" heading. Regex is best-effort (heading text may vary) — the
      real fix is the answerStream request-vs-reporting taxonomy rule. Expected
      RED until then; treat a must_not_contain miss here as advisory.


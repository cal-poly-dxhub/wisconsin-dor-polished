# Document Manifest — single source of truth for all documents in the system.
#
# Every document the chatbot should know about MUST have an entry here.
# The scraper reads this file, downloads each URL, compares content hashes
# against what's in S3, and only uploads/re-processes changed documents.
#
# To add new documents: append a URL to the appropriate category.
# To refresh content: just re-run the scraper — it auto-detects changes.
#
# Categories map to graph frameworks (ingest_config.yaml) and authority levels.
# News pages are sitemap-driven — listed here as a category with a filter pattern.


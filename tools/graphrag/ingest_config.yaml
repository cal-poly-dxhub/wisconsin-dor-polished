# scripts/graphrag/ingest_config.yaml
# GraphRAG ingestion pipeline configuration for Wisconsin DOR

# --- Chunking ---
# NOTE: chunk_size and chunk_overlap apply ONLY to the non-PDF fallback path
# in extract.py (sliding-window over raw text — used for HTML scrapes etc).
# PDF documents (statutes, WPAM, advisories, etc.) are routed through
# pdf_chunking/pdfChunker.py which uses CHUNK_MAX_CHARS=7500 (kept just under
# Titan v2's 8000-char silent-truncation threshold). Changing chunk_size below
# does NOT affect PDF chunking — edit pdfChunker.py instead.
chunk_size: 2000
chunk_overlap: 200
large_doc_threshold: 10000
max_split_sections: 15

# --- Semantic Thresholds ---
semantic_similarity_threshold: 0.55
semantic_batch_size: 15

# --- Concurrency ---
concurrency:
  file_extraction: 5
  chunk_embedding: 10
  vector_upserts: 20
  doc_embedding: 10
  semantic_llm: 5

# --- Document Types -> Graph Node Labels ---
doc_types:
  constitution:       Constitution
  statute:            Statute
  case_law:           CaseLaw
  admin_rule:         AdminRule
  assessment_manual:  AssessmentManual
  faq_page:           FAQ
  guide:              Guide
  advisory:           Advisory
  template:           Template
  form_instruction:   FormInstruction
  iaao_standard:      IAOStandard
  uspap_standard:     USPAPStandard

# --- Framework Definitions (ordered by legal precedence) ---
frameworks:
  - id: FW-CONSTITUTION
    title: "Wisconsin State Constitution"
    authority_level: 1

  - id: FW-STATUTES
    title: "Wisconsin Statutes"
    authority_level: 2
    parent: FW-CONSTITUTION

  - id: FW-CASE-LAW
    title: "Wisconsin Case Law"
    authority_level: 3
    parent: FW-STATUTES

  - id: FW-ADMIN-RULES
    title: "Administrative Rules (Tax Chapters)"
    authority_level: 4
    parent: FW-STATUTES

  - id: FW-WPAM
    title: "Wisconsin Property Assessment Manual"
    authority_level: 5
    parent: FW-ADMIN-RULES

  - id: FW-FAQ
    title: "Property Tax Common Questions"
    authority_level: 6
    parent: FW-WPAM

  - id: FW-GOV-PUBS
    title: "Government Publications & Guides"
    authority_level: 7
    parent: FW-WPAM

  - id: FW-IAAO
    title: "IAAO Standards"
    authority_level: 8
    parent: FW-GOV-PUBS

  - id: FW-USPAP
    title: "USPAP Standards"
    authority_level: 9
    parent: FW-GOV-PUBS

# --- Source-to-Framework Mapping ---
source_to_framework:
  "raw/constitution-":           FW-CONSTITUTION
  "raw/statutes-":               FW-STATUTES
  "raw/case-law/":               FW-CASE-LAW
  "raw/admin_rules-":            FW-ADMIN-RULES
  "raw/wpam-":                   FW-WPAM
  "raw/faq_pages-":              FW-FAQ
  "raw/gov_publications-":       FW-GOV-PUBS
  "raw/complex_inquiry_pages-":  FW-GOV-PUBS
  "raw/form_instructions-":       FW-GOV-PUBS
  "raw/iaao-":                   FW-IAAO
  "raw/uspap-":                  FW-USPAP

# --- Statute Section Families ---
statute_families:
  - code: "CH-17"
    title: "Resignations, Vacancies, Removals"
  - code: "CH-70"
    title: "General Property Taxes"
  - code: "CH-73"
    title: "Revenue - General Provisions"
  - code: "CH-74"
    title: "Property Tax Collection"
  - code: "CH-75"
    title: "Land Sold for Taxes"
  - code: "CH-76"
    title: "Taxation of Certain Utilities"
  - code: "CH-77"
    title: "Taxation of Forest Croplands"

# --- AWS ---
bedrock_embed_model: "amazon.titan-embed-text-v2:0"
bedrock_llm_model: "us.anthropic.claude-sonnet-4-6"
embed_dimension: 1024

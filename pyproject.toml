[project]
name = "wisconsin-bot"
version = "0.1.0"
description = "A chatbot for the Wisconsin Department of Revenue"
readme = "README.md"
requires-python = "==3.13.0"
dependencies = []

[tool.pyrefly]
python-platform = "darwin"
python-interpreter = ".venv/bin/python"
search-path = [
  "backend/layers/",
  "backend/layers/websocket_utils/",
  "backend/lambdas/websocket/",
]
replace-imports-with-any = [
  "backend/layers/websocket_utils",
  "backend/lambdas/websocket",
  "backend/layers",
]


[tool.pyrefly.errors]
bad-assignment = true     # Ensure variable assignments match their annotated types
bad-argument-count = true # Catch calls with incorrect argument counts
bad-argument-type = true  # Catch calls with incorrect argument types
missing-argument = true   # Catch required arguments missing in calls

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"backend/lambdas/agentic_retrieval/_prompt_fallback.py" = ["E501"]
"backend/lambdas/agentic_retrieval/bedrock_streaming.py" = ["E501"]
"backend/lambdas/agentic_retrieval/case_opinion.py" = ["E501"]
"backend/lambdas/agentic_retrieval/conftest.py" = ["E402"]
"backend/lambdas/agentic_retrieval/disambiguation.py" = ["E501"]
"backend/lambdas/agentic_retrieval/main.py" = ["E501"]
"backend/lambdas/agentic_retrieval/prompt.py" = ["E501"]
"backend/lambdas/agentic_retrieval/rag_documents.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_bedrock_messages.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_bedrock_streaming.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_case_law_handling.py" = ["E402", "E501"]
"backend/lambdas/agentic_retrieval/test_case_opinion.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_chat_history.py" = ["E402", "E501"]
"backend/lambdas/agentic_retrieval/test_faq_handling.py" = ["E402", "E501"]
"backend/lambdas/agentic_retrieval/test_handler.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_neptune_client.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_rag_documents.py" = ["E402", "E501"]
"backend/lambdas/agentic_retrieval/test_stream_parser.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_tools.py" = ["E501"]
"backend/lambdas/agentic_retrieval/test_trace_summaries.py" = ["E501"]
"backend/lambdas/agentic_retrieval/trace_summaries.py" = ["E501"]
"backend/lambdas/chat_api/main.py" = ["E501"]
"tools/bedrock_utils.py" = ["E501"]
"tools/bundle.py" = ["E501"]
"tools/ingestion/chunking/flowchart_tools.py" = ["E501"]
"tools/ingestion/chunking/pdfChunker.py" = ["E501"]
"tools/ingestion/chunking/wpam_chunk_filter.py" = ["E501"]
"tools/ingestion/embed.py" = ["E501"]
"tools/ingestion/extract.py" = ["E501"]
"tools/ingestion/ingest_case_law.py" = ["E501"]
"tools/ingestion/load.py" = ["E501"]
"tools/ingestion/ops/cleanup_orphan_chunks.py" = ["E501"]
"tools/ingestion/ops/test_diversity.py" = ["E501"]
"tools/ingestion/tests/test_case_slug.py" = ["E501"]
"tools/ingestion/tests/test_pymupdf_tables.py" = ["E501"]
"tools/ingestion/tests/test_statute_chunker.py" = ["E501"]
"tools/ingestion/tests/test_wpam_chunk_filter.py" = ["E501"]
"tools/simulate_chunking.py" = ["E501"]
"tools/upload_model_configs.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
chat-api = [
  "aws-lambda-powertools>=3.18.0",
  "boto3>=1.40.2",
  "pydantic>=2.11.7",
  "pydantic-core>=2.33.2",
]
step-function-types = ["pydantic>=2.11.7"]
dev = [
    "boto3>=1.40.7",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "toml>=0.10.2",
]
websocket = ["pydantic>=2.11.7"]
websocket-utils = ["pydantic>=2.11.7"]

[tool.pytest.ini_options]
testpaths = ["backend", "tools"]
pythonpath = [
    "backend/layers",
    "backend/lambdas/websocket",
    "tools",
]

[tool.ruff.lint.isort]
known-first-party = ["tools"]
